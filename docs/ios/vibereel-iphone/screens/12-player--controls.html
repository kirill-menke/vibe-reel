      </div>
    </div>
    <div class="player__center" data-component="Transport">
      <button class="pbtn" type="button" aria-label="Back 10 seconds"><svg class="i" viewBox="0 0 24 24"><path d="M12 4.5a7.5 7.5 0 1 1-7.5 7.5"></path><path d="M14.5 2 12 4.5 14.5 7"></path><path d="M9.3 10.2l1.4-1v5.8" stroke-width="1.5"></path><ellipse cx="14.4" cy="12.1" rx="1.8" ry="2.9" stroke-width="1.5"></ellipse></svg></button>
      <button class="pbtn pbtn--lg" type="button" aria-label="Pause"><svg class="i i--fill" viewBox="0 0 24 24"><rect x="6" y="5" width="4.25" height="14" rx="1.2"></rect><rect x="13.75" y="5" width="4.25" height="14" rx="1.2"></rect></svg></button>

    </div>
    <div class="player__bottom">
      <div class="scrubber" data-component="Scrubber">
        <span class="scrubber__time">26:14</span>
        <div class="scrubber__track" role="slider" aria-label="Position" aria-valuetext="26 minutes 14 seconds of 49 minutes 16" style="--p: .53; --b: .71">
          <div class="scrubber__buffer"></div>
          <i class="scrubber__mark" style="--from: .02; --to: .06"></i>

          <span class="scrubber__thumb"></span>
        </div>
        <span class="scrubber__time scrubber__time--end">−23:02</span>
      </div>
      <div class="player__row">
        <a class="pchip" href="12-player--chapters.html"><svg class="i" viewBox="0 0 24 24"><path d="M9 6.5h11M9 12h11M9 17.5h11"></path><path d="M4.5 6.5h.01M4.5 12h.01M4.5 17.5h.01" stroke-width="2.5"></path></svg>Chapters</a>
        <span class="player__spacer"></span>
        <a class="pchip" href="12-player--tracks.html"><svg class="i" viewBox="0 0 24 24"><path d="M4 9.5h3l4.5-4v13L7 14.5H4z"></path><path d="M15.5 9a4 4 0 0 1 0 6M18.2 6.5a7.5 7.5 0 0 1 0 11"></path></svg>English <span class="pchip__dim">DD+ 5.1 Atmos</span></a>
        <a class="pchip" href="12-player--tracks.html"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"></rect><path d="M7 15h4M13.5 15H17M7 11.5h2.5M12 11.5h5"></path></svg>English <span class="pchip__dim">SDH</span></a>

    </div>
