<head>

<title>Player — buffering · VibeReel</title>

<body class="proto">
<div class="device device--landscape" data-component="DeviceFrame" style="width: 852px; height: 393px">
<div class="player" data-component="Player">
  <div class="player__video player__video--dim art" style="--a1: #c9d4d8; --a2: #1a2630; --a3: #3a5566"></div>
  <div class="pcard" role="status" data-component="PlayerStatusCard">
    <div class="pcard__row"><span class="spinner"></span><span>Buffering…</span></div>
    <p class="pcard__hint">This file needs about 36 Mbit/s; the phone is getting about 13. Try 8 Mbit/s in Settings on cellular.</p>
  </div>
  <div class="player__top">
    <a class="iconbtn" href="05-series-detail.html" aria-label="Close player"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
  </div>
</div>
<div class="device__island"></div>
<div class="device__home"></div>
</div>
