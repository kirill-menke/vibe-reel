<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Player — double-tap seek · VibeReel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;display=swap">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
</head>
<body class="proto">
<div class="device device--landscape" data-component="DeviceFrame" style="width: 852px; height: 393px">
<div class="player" data-component="Player">
  <div class="player__video art" style="--a1: #c9d4d8; --a2: #1a2630; --a3: #3a5566"></div>
  <div class="seekflash seekflash--right" data-component="SeekFeedback" role="status" aria-label="Forward 20 seconds">
    <span class="seekflash__chev"><svg class="i i--fill" viewBox="0 0 24 24"><path d="M7.5 5.3v13.4a1 1 0 0 0 1.5.86l10.9-6.7a1 1 0 0 0 0-1.72L9 4.44a1 1 0 0 0-1.5.86z"></path></svg><svg class="i i--fill" viewBox="0 0 24 24"><path d="M7.5 5.3v13.4a1 1 0 0 0 1.5.86l10.9-6.7a1 1 0 0 0 0-1.72L9 4.44a1 1 0 0 0-1.5.86z"></path></svg><svg class="i i--fill" viewBox="0 0 24 24"><path d="M7.5 5.3v13.4a1 1 0 0 0 1.5.86l10.9-6.7a1 1 0 0 0 0-1.72L9 4.44a1 1 0 0 0-1.5.86z"></path></svg></span>
    <span>+20 s</span>
  </div>
  <div class="player__subs" data-component="SubtitleLayer"><p class="player__subtext">— Nobody’s been down this far in years.</p></div>
</div>
<div class="device__island"></div>
<div class="device__home"></div>
</div>
</body>
</html>
