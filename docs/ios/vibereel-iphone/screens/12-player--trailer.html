<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Player — trailer mode · VibeReel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;display=swap">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
</head>
<body class="proto">
<div class="device device--landscape" data-component="DeviceFrame" style="width: 852px; height: 393px">
<div class="player player--trailer" data-component="Player">
  <div class="player__video art" style="--a1: #6f9a7a; --a2: #070b09; --a3: #2c4a3a"></div>
  <div class="player__controls" data-component="PlayerControls">
    <div class="player__scrim player__scrim--top"></div>
    <div class="player__scrim player__scrim--bottom"></div>
    <div class="player__top">
      <a class="iconbtn" href="04-movie-detail.html" aria-label="Close trailer"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
      <div class="player__titles"><p class="player__show">Trailer</p><p class="player__ep">Coldsleep: Outpost</p></div>
      <div class="player__tools">
        <button class="iconbtn" type="button" aria-label="AirPlay"><svg class="i" viewBox="0 0 24 24"><path d="M6.5 17H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-1.5"></path><path d="M12 14.5 16.5 20h-9z"></path></svg></button>
        <button class="iconbtn" type="button" aria-label="Picture in Picture"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"></rect><rect x="12" y="11.5" width="6.5" height="5" rx="1"></rect></svg></button>
      </div>
    </div>
    <div class="player__center" data-component="Transport">
      <button class="pbtn" type="button" aria-label="Back 10 seconds"><svg class="i" viewBox="0 0 24 24"><path d="M12 4.5a7.5 7.5 0 1 1-7.5 7.5"></path><path d="M14.5 2 12 4.5 14.5 7"></path><path d="M9.3 10.2l1.4-1v5.8" stroke-width="1.5"></path><ellipse cx="14.4" cy="12.1" rx="1.8" ry="2.9" stroke-width="1.5"></ellipse></svg></button>
      <button class="pbtn pbtn--lg" type="button" aria-label="Pause"><svg class="i i--fill" viewBox="0 0 24 24"><rect x="6" y="5" width="4.25" height="14" rx="1.2"></rect><rect x="13.75" y="5" width="4.25" height="14" rx="1.2"></rect></svg></button>
      <button class="pbtn" type="button" aria-label="Forward 10 seconds"><svg class="i" viewBox="0 0 24 24"><path d="M12 4.5a7.5 7.5 0 1 0 7.5 7.5"></path><path d="M9.5 2 12 4.5 9.5 7"></path><path d="M9.3 10.2l1.4-1v5.8" stroke-width="1.5"></path><ellipse cx="14.4" cy="12.1" rx="1.8" ry="2.9" stroke-width="1.5"></ellipse></svg></button>
    </div>
    <div class="player__bottom">
      <div class="scrubber" data-component="Scrubber">
        <span class="scrubber__time">0:48</span>
        <div class="scrubber__track" style="--p: .35; --b: .9"><div class="scrubber__buffer"></div><div class="scrubber__fill"></div><span class="scrubber__thumb"></span></div>
        <span class="scrubber__time scrubber__time--end">−1:29</span>
      </div>
      <div class="player__row" style="visibility: hidden"><span class="pchip">·</span></div>
    </div>
  </div>
</div>
<div class="device__island"></div>
<div class="device__home"></div>
</div>
</body>
</html>
