<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Accounts · VibeReel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;display=swap">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
</head>
<body class="proto">
<div class="device" data-component="DeviceFrame" style="width: 393px; height: 852px">
<div class="app">
  <main class="screen" aria-hidden="true">
    <section class="hero"><div class="hero__media art" style="--a1: #b9c7cb; --a2: #142028; --a3: #2c4654"></div><div class="hero__scrim"></div>
      <div class="hero__body"><p class="hero__eyebrow">Continue watching</p><h1 class="hero__title">Undercurrent</h1></div>
    </section>
  </main>
  <div class="scrim"></div>

  <section class="sheet" role="dialog" aria-label="Accounts" data-component="Sheet">
    <div class="sheet__grabber"></div>
    <div class="sheet__head">
      <h2 class="sheet__title">Accounts</h2>
      <a class="closebtn" href="02-home.html" aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
    </div>
    <div class="sheet__body" data-component="AccountSwitcher">
      <p class="group__label">On this iPhone · nas.example.ts.net</p>
      <div class="list" role="radiogroup">
        <button class="row row--inset-sep row--selected" type="button" role="radio" aria-checked="true" data-component="AccountRow">
          <span class="avatar" style="--av: #e6b450">A</span>
          <span class="row__main"><span class="row__title">Alice</span><span class="row__sub">Signed in · Admin</span></span>
          <svg class="i i--sm row__check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>
        </button>
        <a class="row row--inset-sep" href="02-home.html" role="radio" aria-checked="false" data-component="AccountRow">
          <span class="avatar" style="--av: #8fb8c9">L</span>
          <span class="row__main"><span class="row__title">Lena</span><span class="row__sub">Tap to switch</span></span>
        </a>
        <a class="row row--inset-sep" href="02-home.html" role="radio" aria-checked="false" data-component="AccountRow">
          <span class="avatar" style="--av: #b8b0a0">G</span>
          <span class="row__main"><span class="row__title">Gast</span><span class="row__sub">Needs password</span></span>
        </a>
        <a class="row row--inset-sep row--action" href="01-login.html">
          <span class="avatar" style="--av: var(--surface-3); color: var(--gold)"><svg class="i i--sm" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg></span>
          <span class="row__main"><span class="row__title">Add account</span></span>
        </a>
      </div>
      <div class="group">
        <div class="list">
          <a class="row" href="11-settings.html">
            <span class="row__icon"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><circle cx="12" cy="12" r="6.3"></circle><path d="M12 3v2.2M12 18.8V21M21 12h-2.2M5.2 12H3M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6M18.4 18.4l-1.6-1.6M7.2 7.2 5.6 5.6"></path></svg></span>
            <span class="row__main"><span class="row__title">Settings</span></span>
            <span class="row__trail"><svg class="i i--sm" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"></path></svg></span>
          </a>
          <button class="row row--danger" type="button">
            <span class="row__icon" style="color: var(--danger); background: var(--danger-soft)"><svg class="i" viewBox="0 0 24 24"><path d="M14 4.5h3.5A1.5 1.5 0 0 1 19 6v12a1.5 1.5 0 0 1-1.5 1.5H14"></path><path d="M10 8l-4 4 4 4M6 12h9"></path></svg></span>
            <span class="row__main"><span class="row__title">Sign out of Alice</span></span>
          </button>
        </div>
      </div>
    </div>
  </section>
</div>
<div class="device__island"></div>
<div class="device__status"><span>9:41</span><span class="device__glyphs"><svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"></rect><rect x="5" y="5.5" width="3" height="6.5" rx="1"></rect><rect x="10" y="3" width="3" height="9" rx="1"></rect><rect x="15" y="0" width="3" height="12" rx="1"></rect></svg><svg viewBox="0 0 27 12"><rect x=".5" y=".5" width="23" height="11" rx="3.3" fill="none" stroke="#fff" stroke-opacity=".45"></rect><rect x="2" y="2" width="17" height="8" rx="2"></rect><path d="M25 4v4c.8-.3 1.5-1.1 1.5-2S25.8 4.3 25 4z" fill-opacity=".45"></path></svg></span></div>
<div class="device__home"></div>
</div>
</body>
</html>
