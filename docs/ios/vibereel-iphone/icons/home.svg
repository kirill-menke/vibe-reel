<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15z"></path><path d="M10 20.5a2 2 0 0 0 4 0"></path></svg><span class="iconbtn__badge">3</span></button>
      <button class="avatarbtn" aria-label="Account"><span class="avatar" style="--av: #e6b450">A</span></button>
      <span class="chip chip--strong" data-component="Chip"><svg class="i" viewBox="0 0 24 24"><path d="M8 4v16M4.5 7.5 8 4l3.5 3.5M16 20V4M12.5 16.5 16 20l3.5-3.5"></path></svg>Recently added</span>
      <span class="chip chip--on">Unwatched</span>
      <span class="chip">Genre<svg class="i" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"></path></svg></span>
      <span class="pill pill--active" data-component="SeasonPill">Season 2</span>
      <span class="pill"><span class="tick"><svg class="i" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg></span>Season 1</span>
      <span class="pill pill--dim">Season 3 <span class="pill__pct">12%</span></span>
    </div>
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 14px">
      <span class="badge" data-component="Badge"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg>Not in library</span>
      <span class="badge badge--gold"><svg class="i" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19.5h14"></path></svg>2</span>
      <span class="badge badge--rank badge--gold">#1</span>
      <span class="badge badge--rank">#14</span>
      <span class="tick" data-component="WatchedTick"><svg class="i" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg></span>
      <span class="ring ring--glass" style="--p: .43" data-component="ProgressRing"><svg class="ring__svg" viewBox="0 0 36 36"><circle class="ring__track" cx="18" cy="18" r="16" pathLength="100"></circle><circle class="ring__value" cx="18" cy="18" r="16" pathLength="100"></circle></svg><span class="ring__label">43%</span></span>
      <div class="progress" style="--p: .62; width: 120px" data-component="ProgressBar"><div class="progress__fill"></div></div>
      <div class="techbadges" data-component="TechBadges"><span class="tech tech--strong">4K</span><span class="tech tech--strong">Dolby Vision</span><span class="tech">DD+ Atmos</span><span class="tech">5.1</span><span class="tech">EN · DE</span></div>
      <span class="switch switch--on" data-component="Switch"></span>
      <span class="spinner" data-component="Spinner"></span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 16px">
    <p class="group__label" style="padding: 0">Icons · 24 grid · 1.75 stroke · round caps · currentColor</p>
    <div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 4px 10px; border-radius: 12px; background: var(--surface-1)"><svg class="i" viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"></path></svg>
