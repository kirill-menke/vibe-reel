[project]
name = "reel-api"
version = "0.1.0"
description = "VibeReel backend: a LAN API over Sonarr, Radarr, Prowlarr and qBittorrent"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pywebpush>=2.0",
]

# The scraper fallback (search without Prowlarr) additionally needs curl-cffi +
# beautifulsoup4 + lxml. They are optional so a Prowlarr deployment — which
# never imports the scraper — keeps a minimal closure.
[project.optional-dependencies]
scraper = [
    "curl-cffi>=0.7",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.scripts]
reel-api = "reel_api.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reel_api"]
