<!-- The first frame is dark even before the stylesheet arrives (PWA-01). -->
<style>html,body{background:#0a0a0c}</style>
<meta name="theme-color" content="#0a0a0c">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- black-translucent: the page runs up behind the status bar and the Dynamic Island
     (safe-area-inset-top ≈ 59 pt on the 15; every top edge pads with --safe-top).
     ⚠️ iOS 26 (WebKit bug 301108, open): the home-screen web view then reports a height one
     status-bar height SHORT of the screen. app.css sizes the shell with 100lvh in standalone,
     the one unit reported to cover the full screen — unverified on this app's iPhone
     (2026-10-01). Until 2026-09-30 this was the opaque `black` style for exactly that reason.
     iOS reads this tag only when the app is added to the Home Screen: a change needs a
     remove + re-add (viewport.js tells an old install so). -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VibeReel">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<title>VibeReel</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
